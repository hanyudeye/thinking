<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>简约计算器</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .calculator {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(60, 60, 120, 0.15);
            padding: 2rem 1.5rem;
            width: 90vw;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .calculator input,
        .calculator select,
        .calculator textarea {
            font-size: 1.2rem;
            padding: 0.7rem;
            border-radius: 10px;
            border: 1px solid #dbeafe;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0.5rem;
        }
        .calculator textarea {
            resize: none;
            height: 3rem;
            background: #f1f5f9;
        }
        .calculator label {
            font-size: 1.5rem;
            text-align: center;
            margin: 0.5rem 0;
        }
        .calculator .title {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            color: #6366f1;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }
        @media (max-width: 500px) {
            .calculator {
                padding: 1.2rem 0.7rem;
                max-width: 98vw;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="title">计算器</div>
        <input type="number" name="input1" placeholder="输入第一个数字" />
        <select name="operation">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
        </select>
        <input type="number" name="input2" placeholder="输入第二个数字" />
        <label>=</label>
        <textarea name="result" placeholder="计算结果" readonly></textarea>
    </div>
    <script>
        function calculate() {
            const input1 = parseFloat(document.querySelector('input[name="input1"]').value) || 0;
            const input2 = parseFloat(document.querySelector('input[name="input2"]').value) || 0;
            const operation = document.querySelector('select[name="operation"]').value;
            let result;
            switch (operation) {
                case 'add':
                    result = input1 + input2;
                    break;
                case 'subtract':
                    result = input1 - input2;
                    break;
                case 'multiply':
                    result = input1 * input2;
                    break;
                case 'divide':
                    result = input2 !== 0 ? input1 / input2 : '除数不能为零';
                    break;
                default:
                    result = '未知操作';
            }
            document.querySelector('textarea[name="result"]').value = result;
        }
        document.querySelector('input[name="input1"]').addEventListener('input', calculate);
        document.querySelector('input[name="input2"]').addEventListener('input', calculate);
        document.querySelector('select[name="operation"]').addEventListener('change', calculate);
    </script>
</body>
</html>
