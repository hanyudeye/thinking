        <p class="mb-4 text-lg">Tailwind CSS 是一个功能类优先的 CSS 框架，允许你通过组合类名来快速构建自定义设计。</p>
        <h2 class="text-2xl font-semibold mb-4">基本用法</h2>

            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                点击我
            </button>
        </div>

        <p class="mb-4">Tailwind 提供了强大的布局工具 ，例如 Flexbox 和 Grid：</p>
        <div class="flex space-x-4 mb-6">
            <div class="w-1/3 bg-red-500 text-white p-4 rounded">盒子 1</div>
            <div class="w-1/3 bg-green-500 text-white p-4 rounded">盒子 2</div>
