name: Notify Parent Repository

on:
  push:
    branches: ['master', 'main']

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger parent repo workflow
        run: |
          echo "Triggering parent repo workflow..."
          if [ -z "${{ secrets.BLOG_DISPATCH_TOKEN }}" ]; then
            echo "Error: BLOG_DISPATCH_TOKEN secret is not configured"
            exit 1
          fi
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.BLOG_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/hanyudeye/blog/dispatches \
            -d '{"event_type":"content_updated"}')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -eq 204 ] || [ "$http_code" -eq 200 ]; then
            echo "Successfully triggered parent repo workflow (HTTP $http_code)"
          else
            echo "Failed to trigger parent repo workflow (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi