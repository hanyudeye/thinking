<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>雷霆战机 - 网页版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #000;
            touch-action: none; /* 禁止触摸默认行为，优化摇杆体验 */
        }

        /* 游戏画布，适配横竖屏 */
        canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(#1a1a3e, #000);
        }

        /* 虚拟摇杆样式 */
        .joystick {
            position: absolute;
            left: 30px;
            bottom: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
            display: none; /* 手机端才显示 */
        }

        .joystick .knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            touch-action: none;
        }

        /* 大招按钮样式 */
        .skill-btn {
            position: absolute;
            right: 30px;
            bottom: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.7);
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: #fff;
            font-size: 16px;
            text-align: center;
            line-height: 100px;
            z-index: 10;
            display: none; /* 手机端才显示 */
            touch-action: none;
        }

        /* 下一个BOSS按钮 */
        .next-boss-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            background: #ff6b00;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            display: none;
        }

        /* 适配手机端，显示摇杆和大招按钮 */
        @media (max-width: 768px) {
            .joystick, .skill-btn {
                display: block;
            }
        }

        /* 游戏信息面板（分数、时间、关卡） */
        .game-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 虚拟摇杆 -->
    <div class="joystick" id="joystick">
        <div class="knob" id="joystickKnob"></div>
    </div>

    <!-- 大招按钮 -->
    <button class="skill-btn" id="skillBtn">大招清屏</button>

    <!-- 下一个BOSS按钮 -->
    <button class="next-boss-btn" id="nextBossBtn">下一个BOSS →</button>

    <!-- 游戏信息 -->
    <div class="game-info" id="gameInfo">
        关卡：1 | BOSS剩余时间：5:00 | 状态：战斗中
    </div>

    <script>
        // ************************ 全局配置 ************************
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const joystick = document.getElementById('joystick');
        const joystickKnob = document.getElementById('joystickKnob');
        const skillBtn = document.getElementById('skillBtn');
        const nextBossBtn = document.getElementById('nextBossBtn');
        const gameInfo = document.getElementById('gameInfo');

        // 游戏状态
        let gameState = {
            width: window.innerWidth,
            height: window.innerHeight,
            isMobile: window.innerWidth <= 768,
            isSkillActive: false, // 大招是否激活
            bossLevel: 1, // 当前BOSS关卡
            bossTimer: 5 * 60, // BOSS倒计时（秒）
            bossIsDead: false, // BOSS是否被击败
            entities: { // 游戏实体
                player: null,
                boss: null,
                playerBullets: [],
                enemyBullets: [],
                explosions: []
            },
            joystick: { // 摇杆状态
                isPressed: false,
                baseX: 0,
                baseY: 0,
                offsetX: 0,
                offsetY: 0,
                maxDistance: 60
            },
            gamepad: { // 游戏手柄状态
                isConnected: false,
                offsetX: 0,
                offsetY: 0,
                maxDistance: 60
            },
            keyboard: { // 键盘状态
                up: false,
                down: false,
                left: false,
                right: false,
                space: false
            }
        };

        // ************************ 工具类 ************************
        // 碰撞检测（矩形碰撞）
        function isColliding(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        // 格式化时间（秒 → 分:秒）
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = seconds % 60;
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        // 随机数生成
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // ************************ 游戏实体类 ************************
        // 玩家飞机类
        class Player {
            constructor() {
                this.width = 80;
                this.height = 80;
                this.x = gameState.width / 2 - this.width / 2;
                this.y = gameState.height - this.height - 120;
                this.speed = 5;
                this.hp = 1;
                this.color = '#00ffdd';
                this.fireRate = 200; // 子弹发射间隔（毫秒）
                this.lastFireTime = 0;
            }

            // 更新玩家位置（根据摇杆、键盘、手柄）
            update() {
                let moveX = 0;
                let moveY = 0;

                // 摇杆控制（移动端触摸）
                if (gameState.joystick.isPressed) {
                    moveX += gameState.joystick.offsetX * 0.1;
                    moveY += gameState.joystick.offsetY * 0.1;
                }

                // 键盘控制
                if (gameState.keyboard.left) moveX -= 5;
                if (gameState.keyboard.right) moveX += 5;
                if (gameState.keyboard.up) moveY -= 5;
                if (gameState.keyboard.down) moveY += 5;

                // 手柄模拟摇杆控制
                if (gameState.gamepad.isConnected) {
                    moveX += gameState.gamepad.offsetX * 0.1;
                    moveY += gameState.gamepad.offsetY * 0.1;
                }

                // 边界检测
                this.x = Math.max(0, Math.min(gameState.width - this.width, this.x + moveX));
                this.y = Math.max(0, Math.min(gameState.height - this.height, this.y + moveY));
            }

            // 绘制玩家飞机
            draw() {
                ctx.save();
                // 绘制飞机主体（简化版）
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();

                // 绘制飞机细节
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // 发射子弹
            fire(timestamp) {
                if (timestamp - this.lastFireTime > this.fireRate) {
                    // 玩家单发射口（居中）
                    const bulletX = this.x + this.width / 2 - 5;
                    const bulletY = this.y - 10;

                    gameState.entities.playerBullets.push(new PlayerBullet(bulletX, bulletY));
                    this.lastFireTime = timestamp;
                }
            }
        }

        // BOSS类（两关不同属性）
        class Boss {
            constructor(level) {
                this.level = level;
                this.width = level === 1 ? 200 : 250;
                this.height = level === 1 ? 150 : 180;
                this.x = gameState.width / 2 - this.width / 2;
                this.y = 50;
                this.hp = level === 1 ? 100 : 150; // 第二关血量更高
                this.speed = level === 1 ? 1 : 1.5; // 第二关移动更快
                this.color = level === 1 ? '#ff4444' : '#ff8800';
                this.fireRate = level === 1 ? 1000 : 800; // 第二关发射更快
                this.lastFireTime = 0;
                this.firePoints = [ // 两个发射口
                    { x: this.x + 30, y: this.y + this.height - 20 },
                    { x: this.x + this.width - 30, y: this.y + this.height - 20 }
                ];
                this.moveDirection = 1; // 左右移动方向
            }

            // 更新BOSS状态（移动+发射子弹）
            update(timestamp) {
                if (gameState.bossIsDead) return;

                // 左右往返移动
                this.x += this.speed * this.moveDirection;
                if (this.x <= 0 || this.x + this.width >= gameState.width) {
                    this.moveDirection *= -1;
                }

                // 更新发射口位置
                this.firePoints = [
                    { x: this.x + 30, y: this.y + this.height - 20 },
                    { x: this.x + this.width - 30, y: this.y + this.height - 20 }
                ];

                // 发射子弹（两个发射口发射不同类型子弹）
                if (timestamp - this.lastFireTime > this.fireRate) {
                    this.firePoints.forEach((point, index) => {
                        if (this.level === 1) {
                            // 第一关：普通直线子弹（两个发射口同类型）
                            gameState.entities.enemyBullets.push(new EnemyBullet(point.x, point.y, index));
                        } else {
                            // 第二关：发射口1直线子弹，发射口2跟踪子弹（简单跟踪）
                            if (index === 0) {
                                gameState.entities.enemyBullets.push(new EnemyBullet(point.x, point.y, 0));
                            } else {
                                gameState.entities.enemyBullets.push(new EnemyBullet(point.x, point.y, 1, true));
                            }
                        }
                    });
                    this.lastFireTime = timestamp;
                }
            }

            // 绘制BOSS
            draw() {
                if (gameState.bossIsDead) return;

                ctx.save();
                // 绘制BOSS主体
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // 绘制两个发射口
                ctx.fillStyle = '#000';
                this.firePoints.forEach(point => {
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 15, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 绘制血量条
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(this.x, this.y - 20, this.width, 10);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x, this.y - 20, (this.hp / (this.level === 1 ? 100 : 150)) * this.width, 10);

                // 绘制关卡标识
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText(`BOSS ${this.level}`, this.x + this.width / 2 - 30, this.y + this.height / 2);
                ctx.restore();
            }

            // 受到伤害
            takeDamage(damage = 1) {
                this.hp -= damage;
                if (this.hp <= 0) {
                    gameState.bossIsDead = true;
                    gameState.bossTimer = 0;
                    nextBossBtn.style.display = 'block';
                    this.createExplosion();
                }
            }

            // 击败时生成爆炸效果
            createExplosion() {
                for (let i = 0; i < 20; i++) {
                    gameState.entities.explosions.push(new Explosion(
                        this.x + random(0, this.width),
                        this.y + random(0, this.height)
                    ));
                }
            }
        }

        // 玩家子弹类
        class PlayerBullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 10;
                this.height = 20;
                this.speed = 10;
                this.color = '#00ffdd';
            }

            update() {
                this.y -= this.speed;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            // 是否超出屏幕
            isOffScreen() {
                return this.y + this.height < 0;
            }
        }

        // 敌机子弹类
        class EnemyBullet {
            constructor(x, y, type, isTracking = false) {
                this.x = x;
                this.y = y;
                this.width = 10;
                this.height = 20;
                this.speed = type === 0 ? 5 : 7;
                this.color = type === 0 ? '#ff4444' : '#ffff00';
                this.isTracking = isTracking; // 是否跟踪玩家
                this.trackingSpeed = 0.5;
            }

            update() {
                // 跟踪玩家逻辑
                if (this.isTracking && gameState.entities.player) {
                    const player = gameState.entities.player;
                    const dx = player.x + player.width / 2 - (this.x + this.width / 2);
                    const dy = player.y + player.height / 2 - (this.y + this.height / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > 0) {
                        this.x += (dx / distance) * this.trackingSpeed;
                        this.y += (dy / distance) * this.trackingSpeed;
                    }
                } else {
                    this.y += this.speed;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            // 是否超出屏幕
            isOffScreen() {
                return this.y > gameState.height;
            }
        }

        // 爆炸效果类
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = random(10, 30);
                this.alpha = 1;
                this.speed = 0.05;
                this.color = `rgb(${random(200, 255)}, ${random(0, 100)}, ${random(0, 50)})`;
            }

            update() {
                this.alpha -= this.speed;
                this.size += 0.5;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 是否消失
            isGone() {
                return this.alpha <= 0;
            }
        }

        // ************************ 游戏逻辑 ************************
        // 初始化游戏
        function initGame() {
            // 适配画布大小
            resizeCanvas();

            // 初始化玩家和BOSS
            gameState.entities.player = new Player();
            gameState.entities.boss = new Boss(gameState.bossLevel);

            // 重置游戏状态
            gameState.bossIsDead = false;
            gameState.bossTimer = 5 * 60;
            nextBossBtn.style.display = 'none';
            updateGameInfo();

            // 开始游戏循环
            requestAnimationFrame(gameLoop);
        }

        // 调整画布大小（适配横竖屏）
        function resizeCanvas() {
            gameState.width = window.innerWidth;
            gameState.height = window.innerHeight;
            gameState.isMobile = window.innerWidth <= 768;

            canvas.width = gameState.width;
            canvas.height = gameState.height;

            // 重置摇杆基础位置
            gameState.joystick.baseX = joystick.offsetLeft + joystick.offsetWidth / 2;
            gameState.joystick.baseY = joystick.offsetTop + joystick.offsetHeight / 2;
        }

        // 更新游戏信息面板
        function updateGameInfo() {
            const status = gameState.bossIsDead ? 'BOSS已击败' : '战斗中';
            gameInfo.innerHTML = `
                关卡：${gameState.bossLevel} | 
                BOSS剩余时间：${formatTime(gameState.bossTimer)} | 
                状态：${status}
            `;
        }

        // 大招清屏功能
        function activateSkill() {
            if (gameState.isSkillActive || gameState.bossIsDead) return;

            gameState.isSkillActive = true;
            // 清除所有敌机子弹
            gameState.entities.enemyBullets = [];

            // 大招视觉效果（简单闪烁）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(0, 0, gameState.width, gameState.height);

            // 3秒后关闭大招状态
            setTimeout(() => {
                gameState.isSkillActive = false;
            }, 3000);
        }

        // 切换到下一个BOSS
        function nextBoss() {
            if (gameState.bossLevel >= 2) {
                alert('恭喜！已通关所有BOSS关卡！');
                gameState.bossLevel = 1;
            } else {
                gameState.bossLevel++;
            }

            // 重置实体和状态
            gameState.entities.playerBullets = [];
            gameState.entities.enemyBullets = [];
            gameState.entities.explosions = [];
            gameState.entities.boss = new Boss(gameState.bossLevel);

            // 重置计时器和按钮
            gameState.bossIsDead = false;
            gameState.bossTimer = 5 * 60;
            nextBossBtn.style.display = 'none';
            updateGameInfo();
        }

        // 游戏主循环
        function gameLoop(timestamp) {
            // 更新手柄输入
            updateGamepadInput();

            // 清屏
            ctx.clearRect(0, 0, gameState.width, gameState.height);

            // 倒计时更新（BOSS未被击败时）
            if (!gameState.bossIsDead) {
                // 每秒钟更新一次倒计时
                if (Math.floor(timestamp / 1000) !== Math.floor((timestamp - 16) / 1000)) {
                    gameState.bossTimer = Math.max(0, gameState.bossTimer - 1);
                    updateGameInfo();

                    // 无敌模式 - 倒计时无限制
                    // 原有的失败逻辑已禁用
                }
            }

            // 更新并绘制玩家
            const player = gameState.entities.player;
            if (player) {
                player.update();
                player.draw();
                player.fire(timestamp); // 自动发射子弹
            }

            // 更新并绘制BOSS
            const boss = gameState.entities.boss;
            if (boss) {
                boss.update(timestamp);
                boss.draw();
            }

            // 更新并绘制玩家子弹（含碰撞检测）
            gameState.entities.playerBullets = gameState.entities.playerBullets.filter(bullet => {
                bullet.update();
                bullet.draw();

                // 子弹与BOSS碰撞检测
                if (!gameState.bossIsDead && boss && isColliding(bullet, boss)) {
                    boss.takeDamage();
                    return false;
                }

                return !bullet.isOffScreen();
            });

            // 更新并绘制敌机子弹（含碰撞检测）
            gameState.entities.enemyBullets = gameState.entities.enemyBullets.filter(bullet => {
                bullet.update();
                bullet.draw();

                // 玩家无敌模式 - 子弹直接穿过
                // 子弹与玩家碰撞检测已禁用

                return !bullet.isOffScreen();
            });

            // 更新并绘制爆炸效果
            gameState.entities.explosions = gameState.entities.explosions.filter(explosion => {
                explosion.update();
                explosion.draw();
                return !explosion.isGone();
            });

            // 继续游戏循环
            requestAnimationFrame(gameLoop);
        }

        // ************************ 事件监听 ************************
        // 键盘事件监听
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') { gameState.keyboard.up = true; e.preventDefault(); }
            if (key === 'arrowdown' || key === 's') { gameState.keyboard.down = true; e.preventDefault(); }
            if (key === 'arrowleft' || key === 'a') { gameState.keyboard.left = true; e.preventDefault(); }
            if (key === 'arrowright' || key === 'd') { gameState.keyboard.right = true; e.preventDefault(); }
            if (key === ' ') { activateSkill(); e.preventDefault(); }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') { gameState.keyboard.up = false; }
            if (key === 'arrowdown' || key === 's') { gameState.keyboard.down = false; }
            if (key === 'arrowleft' || key === 'a') { gameState.keyboard.left = false; }
            if (key === 'arrowright' || key === 'd') { gameState.keyboard.right = false; }
        });

        // 游戏手柄连接/断开事件
        window.addEventListener('gamepadconnected', (e) => {
            console.log('游戏手柄已连接:', e.gamepad.id);
            gameState.gamepad.isConnected = true;
        });

        window.addEventListener('gamepaddisconnected', (e) => {
            console.log('游戏手柄已断开:', e.gamepad.id);
            gameState.gamepad.isConnected = false;
            gameState.gamepad.offsetX = 0;
            gameState.gamepad.offsetY = 0;
        });

        // 手柄输入更新函数（在游戏循环中调用）
        function updateGamepadInput() {
            const gamepads = navigator.getGamepads?.() || [];
            if (gamepads.length === 0) {
                gameState.gamepad.isConnected = false;
                return;
            }

            const gamepad = gamepads[0];
            if (!gamepad) {
                gameState.gamepad.isConnected = false;
                return;
            }

            gameState.gamepad.isConnected = true;

            // 获取左摇杆数据（轴0和轴1）
            const axisX = gamepad.axes[0] || 0;
            const axisY = gamepad.axes[1] || 0;

            // 死区处理（小于0.1的输入忽略）
            const deadZone = 0.1;
            gameState.gamepad.offsetX = Math.abs(axisX) > deadZone ? axisX * gameState.gamepad.maxDistance : 0;
            gameState.gamepad.offsetY = Math.abs(axisY) > deadZone ? axisY * gameState.gamepad.maxDistance : 0;

            // 检测手柄按钮（按钮0通常是A按钮，可用于发大招）
            if (gamepad.buttons && gamepad.buttons[0] && gamepad.buttons[0].pressed) {
                // A按钮用于发大招
                if (!gameState.lastGamepadButtonState) {
                    activateSkill();
                }
                gameState.lastGamepadButtonState = true;
            } else {
                gameState.lastGamepadButtonState = false;
            }
        }

        // 窗口大小变化（适配横竖屏切换）
        window.addEventListener('resize', resizeCanvas);

        // 摇杆事件（移动端触摸）
        joystickKnob.addEventListener('touchstart', (e) => {
            e.preventDefault();
            gameState.joystick.isPressed = true;
            const touch = e.touches[0];
            gameState.joystick.baseX = touch.clientX;
            gameState.joystick.baseY = touch.clientY;
        });

        document.addEventListener('touchmove', (e) => {
            if (!gameState.joystick.isPressed) return;
            e.preventDefault();

            const touch = e.touches[0];
            const dx = touch.clientX - gameState.joystick.baseX;
            const dy = touch.clientY - gameState.joystick.baseY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 限制摇杆最大距离
            if (distance > gameState.joystick.maxDistance) {
                const ratio = gameState.joystick.maxDistance / distance;
                gameState.joystick.offsetX = dx * ratio;
                gameState.joystick.offsetY = dy * ratio;
            } else {
                gameState.joystick.offsetX = dx;
                gameState.joystick.offsetY = dy;
            }

            // 更新摇杆视觉位置
            joystickKnob.style.transform = `translate(${gameState.joystick.offsetX}px, ${gameState.joystick.offsetY}px)`;
        });

        document.addEventListener('touchend', () => {
            if (!gameState.joystick.isPressed) return;

            gameState.joystick.isPressed = false;
            gameState.joystick.offsetX = 0;
            gameState.joystick.offsetY = 0;

            // 重置摇杆位置
            joystickKnob.style.transform = 'translate(-50%, -50%)';
        });

        // 大招按钮点击/触摸事件
        skillBtn.addEventListener('click', activateSkill);
        skillBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            activateSkill();
        });

        // 下一个BOSS按钮事件
        nextBossBtn.addEventListener('click', nextBoss);
        nextBossBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            nextBoss();
        });

        // ************************ 启动游戏 ************************
        window.onload = initGame;
    </script>
</body>
</html>
