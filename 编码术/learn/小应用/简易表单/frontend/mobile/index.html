<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提交表单</title>
<style>
body { font-family: Arial; padding: 20px; background: #f5f5f5; }
input, textarea { width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; }
</style>
</head>
<body>
<h2>提交信息</h2>
<input type="text" id="name" placeholder="姓名" required>
<input type="text" id="phone" placeholder="电话" required>
<textarea id="message" placeholder="留言"></textarea>
<button onclick="submitForm()">提交</button>

<script>
function submitForm() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!name || !phone) {
        alert('姓名和电话不能为空');
        return;
    }

    fetch('http://localhost:3000/form/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, message })
    }).then(res => res.json())
      .then(data => {
        if (data.success) {
            alert('提交成功！');
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('message').value = '';
        } else {
            alert('提交失败');
        }
    });
}
</script>
</body>
</html>
