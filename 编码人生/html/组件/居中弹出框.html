<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>居中弹出框</title>

    <style>
        /* 背景遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* 半透明黑色背景 */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        /* 弹出框样式 */
        .popup {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: popup-appear 0.3s ease-out;
        }

        /* 关闭按钮 */
        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4e91f9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #3b7ae0;
        }

        /* 弹出动画 */
        @keyframes popup-appear {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="overlay">
        <div class="popup">
            <h2>弹出框标题</h2>
            <p>这里是弹出框的内容</p>
            <button class="close-btn">关闭</button>
        </div>
    </div>


</body>

</html>
