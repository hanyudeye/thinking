<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>后台管理</title>
<style>
body { font-family: Arial; padding: 20px; }
input { margin: 5px; padding: 8px; }
button { padding: 8px 12px; margin: 5px; cursor: pointer; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
td, th { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #f5f5f5; }
.delete-btn { background: red; color: white; border: none; padding: 5px 8px; border-radius: 4px; }
</style>
</head>
<body>
<h2>后台管理</h2>
<div>
    <input type="text" id="username" placeholder="账号">
    <input type="password" id="password" placeholder="密码">
    <button onclick="login()">登录</button>
</div>
<div id="content" style="display:none;">
    <h3>表单列表</h3>
    <table>
        <thead><tr><th>ID</th><th>姓名</th><th>电话</th><th>留言</th><th>操作</th></tr></thead>
        <tbody id="list"></tbody>
    </table>
</div>

<script>
let token = '';

function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    }).then(res => {
        if (!res.ok) throw new Error('登录失败');
        return res.json();
    }).then(data => {
        token = data.token;
        document.getElementById('content').style.display = 'block';
        loadForms();
    }).catch(() => alert('账号或密码错误'));
}

function loadForms() {
    fetch('http://localhost:3000/form/list', {
        headers: { 'Authorization': 'Bearer ' + token }
    }).then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('list');
        tbody.innerHTML = '';
        data.data.forEach(f => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${f.id}</td><td>${f.name}</td><td>${f.phone}</td><td>${f.message}</td>
            <td><button class="delete-btn" onclick="deleteForm(${f.id})">删除</button></td>`;
            tbody.appendChild(tr);
        });
    });
}

function deleteForm(id) {
    fetch('http://localhost:3000/form/delete/' + id, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
    }).then(res => res.json())
      .then(() => loadForms());
}
</script>
</body>
</html>
