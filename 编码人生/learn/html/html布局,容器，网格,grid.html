<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html布局,容器，网格,grid</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 200px 500px;
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>
    <h1>这篇文章主要讲解：html的布局,容器，网格,grid</h1>

    <h2>网格</h2>
    <div class="grid">
        <div>第一列的内容超过了容器的宽度会被溢出</div>
        <div>第二列的内容</div>
    </div>

</body>

</html>
